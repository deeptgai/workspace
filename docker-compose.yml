services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: deeptg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deeptg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deeptg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deeptg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.85}
    container_name: deeptg-seaweedfs
    restart: unless-stopped
    command:
      - server
      - -s3
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.port=${SEAWEEDFS_MASTER_PORT:-9333}
      - -volume.port=${SEAWEEDFS_VOLUME_PORT:-8080}
      - -filer.port=${SEAWEEDFS_FILER_PORT:-8888}
      - -s3.port=${SEAWEEDFS_S3_PORT:-8333}
    ports:
      - "${SEAWEEDFS_S3_PUBLISHED_PORT:-8333}:${SEAWEEDFS_S3_PORT:-8333}"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8333/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
